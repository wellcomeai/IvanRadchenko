[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:backend]
; Воркеры, таймауты и т.д. — в backend/gunicorn.conf.py (WEB_CONCURRENCY, GUNICORN_TIMEOUT).
command=gunicorn main:app -c gunicorn.conf.py
directory=/app/backend
user=app
; supervisord не меняет HOME при смене user, а asyncpg ищет ключи в ~/.postgresql
environment=HOME="/app"
autostart=true
autorestart=true
; Не уходить в FATAL после 3 быстрых падений: иначе контейнер жив, а API отдаёт 502.
startsecs=10
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=node server.js
directory=/app/frontend
user=app
environment=PORT=3000,HOSTNAME="127.0.0.1",NODE_ENV=production
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
